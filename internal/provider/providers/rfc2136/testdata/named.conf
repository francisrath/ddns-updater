options {
    directory "/var/lib/bind";
    listen-on { any; };
    listen-on-v6 { any; };
    allow-query { any; };
    recursion no;
    dnssec-validation no;
    pid-file "/var/lib/bind/named.pid";
};

key "ddns-key" {
    algorithm hmac-sha256;
    secret "dGVzdC1zZWNyZXQtZm9yLWRkbnMtdXBkYXRlcnM=";
};

// Zone requiring a TSIG signed update.
zone "example.com" {
    type primary;
    file "/var/lib/bind/db.example.com";
    allow-update { key "ddns-key"; };
};

// Zone accepting unsigned updates, to exercise the no-TSIG path.
zone "open.com" {
    type primary;
    file "/var/lib/bind/db.open.com";
    allow-update { any; };
};
